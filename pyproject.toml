[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews-xai"
version = "0.2.0"
description = "Explainable fake news detection: fine-tuned BERT with SHAP and LIME"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdullah Ajmal" }]
dependencies = [
    "torch==2.5.1",
    "transformers==4.47.1",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "shap==0.46.0",
    "lime==0.2.0.1",
    "gradio==5.9.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
